<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무기 상점</title>
<style>
:root{--navy:#0a3a8c;--ink:#4a4a4a;--muted:#7a7a7a;--line:#e8e8e8;--ok:#1fb355;--out:#d33a3a}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;min-height:84px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none}
.logo{width:60px;height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-size:20px}
nav{display:flex;flex-wrap:wrap}
nav button{background:none;border:0;font:inherit;font-size:13px;font-weight:700;letter-spacing:.03em;color:#333;padding:10px 14px;cursor:pointer}
nav button:hover{color:var(--navy)}
nav button.on{color:var(--navy)}

h1{font-size:24px;font-weight:400;color:#555;margin:64px 0 0;text-transform:uppercase}
h1::after{content:"";display:block;width:40px;height:2px;background:#222;margin-top:14px}
.intro{margin:22px 0 0;color:#555;white-space:pre-line}
.notice{margin:18px 0 0;padding:12px 16px;border-left:3px solid var(--navy);background:#f5f8fd;color:#333;white-space:pre-line}

.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:36px 0 24px}
.tools input{flex:1 1 260px;max-width:420px;font:inherit;padding:10px 14px;border:1px solid #ccc;background:#fff;color:#333}
.tools input:focus{border-color:var(--navy);outline:none}
.count{color:var(--muted);font-size:13px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:0 0 70px}
.card{display:block;width:100%;text-align:center;background:#fff;border:1px solid #eee;padding:0 20px 24px;cursor:pointer;font:inherit;color:inherit}
.card:hover{border-color:#cfd8ea}
.card span{display:block}
.imgbox{height:230px;display:flex!important;align-items:center;justify-content:center;margin:0 -20px 16px;padding:12px 20px 0}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
.card.out .imgbox img{opacity:.45}
.cat{font-size:11px;color:var(--navy);margin-bottom:4px}
.name{font-size:14px;font-weight:700;color:#111;margin-bottom:8px;word-break:break-word}
.spec{color:#666;margin-bottom:10px;word-break:break-word}
.desc{font-size:12px;color:#555;line-height:1.9;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.price{font-size:17px;font-weight:700;color:var(--navy)}
.stock{font-size:14px;margin-top:2px}
.stock.ok{color:var(--ok)}
.stock.no{color:var(--out)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}

dialog{border:0;padding:0;max-width:780px;width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dlg .pic{background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;min-height:300px}
.dlg .pic img{max-width:100%;max-height:340px;object-fit:contain}
.dlg .txt{padding:28px 28px 28px 8px}
.dlg .name{font-size:18px;margin-bottom:6px}
.dlg .full{white-space:pre-line;color:#555;margin:14px 0 18px;word-break:break-word}
.close{float:right;background:none;border:0;font-size:26px;line-height:1;color:#777;cursor:pointer;padding:6px 12px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:22px 0 40px;white-space:pre-line}

@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}h1{margin-top:40px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.dlg{grid-template-columns:1fr}.dlg .txt{padding:0 22px 24px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="./"><span class="logo" id="logo"></span><span class="brand-name" id="brand"></span></a>
    <nav id="nav" aria-label="무기 종류"></nav>
  </div>
</header>

<main class="wrap">
  <h1 id="pageTitle"></h1>
  <p class="intro" id="intro"></p>
  <p class="notice" id="notice" hidden></p>

  <div class="tools">
    <input id="search" type="search" placeholder="무기 이름으로 검색" aria-label="무기 검색" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"><p class="empty">불러오는 중...</p></div>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<dialog id="dlg" aria-label="무기 상세 정보"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#f4f4f4"/><text x="200" y="158" font-family="sans-serif" font-size="18" fill="#aaa" text-anchor="middle">사진 없음</text></svg>');

let DATA = null, cat = 'all', q = '';

function money(n){
  if (n === '' || n == null) return '가격 문의';
  const t = Number(n).toLocaleString('ko-KR');
  const s = DATA.settings.currencySymbol || '';
  return DATA.settings.currencyBefore ? s + ' ' + t : t + s;
}
function stockHtml(it){
  return it.stock > 0
    ? `<span class="stock ok">■ 재고 ${it.stock}개</span>`
    : `<span class="stock no">■ 품절</span>`;
}

function init(){
  const s = DATA.settings;
  document.title = s.siteName || '무기 상점';
  $('#brand').textContent = s.siteName || '';
  $('#logo').innerHTML = s.logo ? `<img src="${esc(s.logo)}" alt="">` : esc((s.siteName || '?').trim().charAt(0).toUpperCase());
  $('#pageTitle').textContent = s.pageTitle || '';
  $('#intro').textContent = s.intro || '';
  if (s.notice){ $('#notice').textContent = s.notice; $('#notice').hidden = false; }
  $('#footer').textContent = s.footer || '';
  buildNav();
  render();
}

function buildNav(){
  const cats = DATA.categories || [];
  const btn = (k, label) => `<button type="button" data-cat="${esc(k)}" class="${cat === k ? 'on' : ''}">${esc(label)}</button>`;
  $('#nav').innerHTML = btn('all', '전체') + cats.map(c => btn(c, c)).join('');
}

function render(){
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = DATA.items.filter(it =>
    (cat === 'all' || it.category === cat) &&
    words.every(w => [it.name, it.category, it.spec, it.desc].join(' ').toLowerCase().includes(w))
  );
  $('#count').textContent = `${list.length}개`;
  $('#grid').innerHTML = list.length ? list.map(it => `
    <button type="button" class="card${it.stock > 0 ? '' : ' out'}" data-id="${esc(it.id)}">
      <span class="imgbox"><img src="${esc(it.image || PH)}" alt="${esc(it.name)}" loading="lazy"></span>
      <span class="cat">${esc(it.category || '기타')}</span>
      <span class="name">${esc(it.name)}</span>
      ${it.spec ? `<span class="spec">${esc(it.spec)}</span>` : ''}
      ${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : ''}
      <span class="price">${esc(money(it.price))}</span>
      ${stockHtml(it)}
    </button>`).join('')
    : '<p class="empty">검색 결과가 없습니다. 다른 검색어를 입력하거나 종류를 바꿔 보세요.</p>';
}

function openItem(id){
  const it = DATA.items.find(i => i.id === id);
  if (!it) return;
  const dlg = $('#dlg');
  dlg.innerHTML = `
    <button class="close" type="button" aria-label="닫기">×</button>
    <div class="dlg">
      <div class="pic"><img src="${esc(it.image || PH)}" alt="${esc(it.name)}"></div>
      <div class="txt">
        <div class="cat">${esc(it.category || '기타')}</div>
        <div class="name">${esc(it.name)}</div>
        ${it.spec ? `<div class="spec">${esc(it.spec)}</div>` : ''}
        <div class="full">${esc(it.desc || '')}</div>
        <div class="price">${esc(money(it.price))}</div>
        ${stockHtml(it)}
      </div>
    </div>`;
  dlg.showModal();
}

document.addEventListener('error', e => {
  if (e.target.tagName === 'IMG' && e.target.src !== PH) e.target.src = PH;
}, true);
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.cat; buildNav(); render();
});
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) openItem(c.dataset.id);
});
$('#search').addEventListener('input', e => { q = e.target.value; render(); });
$('#dlg').addEventListener('click', e => {
  if (e.target.id === 'dlg' || e.target.closest('.close')) e.currentTarget.close();
});

fetch('data.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { DATA = d; DATA.settings = DATA.settings || {}; DATA.items = DATA.items || []; init(); })
  .catch(() => {
    $('#grid').innerHTML = '<p class="empty">data.json 파일을 불러오지 못했습니다.<br>파일을 더블클릭해서 연 경우에는 보이지 않을 수 있습니다. GitHub Pages 주소로 접속해 주세요.</p>';
  });
</script>
</body>
</html>
